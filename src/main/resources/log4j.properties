# ============================================================================
# Log4j 日志配置（log4j 1.2.x）
# ----------------------------------------------------------------------------
# 启用方式：
#   mybatis-config.xml 中 <setting name="logImpl" value="LOG4J"/> 已开启，
#   使 MyBatis 直接使用 Log4j 记录 SQL 语句与参数绑定信息。
#
# 日志级别（由低到高）：ALL < DEBUG < INFO < WARN < ERROR < FATAL < OFF
#
# SLF4J 兼容性：
#   本项目引入 slf4j-log4j12（slf4j 1.7.36），业务代码 useLogger：
#   private static final Logger log = LoggerFactory.getLogger(Xxx.class);
#   底层会自动路由到本文件的 Log4j，无需在业务代码中依赖 Log4j API。
#
# 性能提示：
#   主日志 pattern 刻意不使用 %M(方法名)/%L(行号) —— 二者需要解析 StackTrace，
#   高频下对运行性能影响明显。需要定位时请临时在日志目录追加明细配置。
# ============================================================================

# ---------------- 根日志器 ----------------
# 默认 INFO：业务日志、MyBatis INFO 级别信息会输出；DEBUG 由下方包别单独开启。
log4j.rootLogger=INFO, console, file

# ---------------------------------------------------------------------------
# 控制台输出（console）
# ---------------------------------------------------------------------------
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] [%t] - %m%n

# ---------------------------------------------------------------------------
# 滚动文件输出（file）——按大小滚动，最多保留 5 份
# 日志文件默认输出到项目相对目录 logs/ 下，需保证该目录存在（见 README）。
# ---------------------------------------------------------------------------
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/mybatis-demo.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.Encoding=UTF-8
log4j.appender.file.Threshold=INFO
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] [%t] - %m%n

# ---------------------------------------------------------------------------
# SQL 专用控制台输出（sqlConsole）—— 便于单独观察 MyBatis 执行的 SQL
# ---------------------------------------------------------------------------
log4j.appender.sqlConsole=org.apache.log4j.ConsoleAppender
log4j.appender.sqlConsole.Target=System.out
log4j.appender.sqlConsole.layout=org.apache.log4j.PatternLayout
log4j.appender.sqlConsole.layout.ConversionPattern=%-5p %m%n

# ---------------------------------------------------------------------------
# MyBatis SQL 日志（DEBUG）
# ---------------------------------------------------------------------------
# MyBatis 的日志分类器使用 Mapper 的全限定名（com.chapter01.UserMapper），
# 因此把父包 com.chapter01 的级别设为 DEBUG 即可捕获：
#   ==>  Preparing: SELECT * FROM user WHERE id = ?      (SQL 语句)
#   ==> Parameters: 1(String)                            (参数绑定值)
#   <==      Total: 1                                    (命中结果数)
# additivity=true（默认），SQL 日志同时进入 console / file 的主输出；
# 为便于观察，再额外追加 sqlConsole，输出更精简的 SQL 样式。
log4j.logger.com.chapter01=DEBUG, sqlConsole

# ---------------------------------------------------------------------------
# 其它可调项（按需开启）
# ---------------------------------------------------------------------------
# 只想看 SQL 而屏蔽 MyBatis 其它无关输出时，可把 Mapper 包单独设总和级别：
# log4j.logger.com.chapter01.UserMapper=DEBUG
# 第三方/框架日志降噪示例：
# log4j.logger.org.apache=WARN
# log4j.logger.org.springframework=WARN